name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FastVpn.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: bash FastVpn/ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FastVpn-apk
          path: FastVpn/app/build/outputs/apk/release/*.apk
